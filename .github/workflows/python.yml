name: python

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "tests/**"
      - "fixtures/**"
      - "schema/**"
      - "config/**"
      - "scripts/**"
      - "ops/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "ingest/**"
      - "tests/**"
      - "fixtures/**"
      - "schema/**"
      - "config/**"
      - "scripts/**"
      - "ops/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5.4.0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Shellcheck startup scripts
        env:
          SHELLCHECK_VERSION: "0.9.0"
          SHELLCHECK_SHA256: "700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck scripts/start-mac.sh scripts/install-launchagent.sh
      - name: Run pytest
        run: |
          set -euo pipefail
          collected="$(python -m pytest --collect-only -q 2>&1 | tee /dev/stderr | tail -n1)"
          count="$(echo "$collected" | awk '/tests collected/ { print $1; exit }')"
          if [ -z "${count:-}" ] || [ "$count" -lt 1 ]; then
            echo "Expected at least one test to be collected, got: ${count:-0}"
            exit 1
          fi
          echo "Collected $count tests"
          python -m pytest -q
