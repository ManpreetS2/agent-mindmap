name: python

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "tests/**"
      - "fixtures/**"
      - "schema/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "ingest/**"
      - "tests/**"
      - "fixtures/**"
      - "schema/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5.4.0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Shellcheck startup scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/start-mac.sh scripts/install-launchagent.sh
      - name: Run pytest
        run: |
          set -euo pipefail
          collected="$(python -m pytest --collect-only -q 2>&1 | tee /dev/stderr | tail -n1)"
          count="$(echo "$collected" | awk '/tests collected/ { print $1; exit }')"
          if [ -z "${count:-}" ] || [ "$count" -lt 1 ]; then
            echo "Expected at least one test to be collected, got: ${count:-0}"
            exit 1
          fi
          echo "Collected $count tests"
          python -m pytest -q
