[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mindmap"
version = "0.1.0"
description = "Agent activity mind map dashboard (MINDMAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
t3 = ["mcp==1.30.0", "jsonschema>=4.23.0"]
dev = [
  "jsonschema>=4.23.0",
  "pytest>=8.3.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

